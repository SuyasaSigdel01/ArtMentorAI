[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artmentor"
version = "0.1.0"
description = "AI painting tutor — pattern generation, color mixing, and practice feedback"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "colour-science>=0.4.4",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
artmentor = "artmentor.cli:main"

[tool.setuptools.packages.find]
include = ["artmentor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# RUF046 flags int() around values it believes are already ints. Ours wrap numpy
# scalars (np.intp, np.int64), where the cast is load-bearing: without it these
# leak into dataclasses and fail JSON serialization at the API boundary.
ignore = ["RUF046"]
