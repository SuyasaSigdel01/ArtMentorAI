[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artmentor"
version = "0.1.0"
description = "AI painting tutor — pattern generation, color mixing, and practice feedback"
requires-python = ">=3.11"
dependencies = [
    # Colour science and imaging.
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "colour-science>=0.4.4",
    "Pillow>=10.4",
    # The web layer. These were missing until a clean clone on a second
    # machine failed at `from fastapi.testclient import TestClient` — they had
    # only ever been pip-installed by hand on the original laptop, so the
    # project appeared to work while being uninstallable by anyone else.
    "fastapi>=0.115",
    "pydantic>=2.8",
    # [standard] is what provides watchfiles, and therefore `--reload`.
    "uvicorn[standard]>=0.30",
    # FastAPI needs this for Form() and File(); every upload route uses both.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# httpx is what starlette's TestClient runs on, so the API tests need it.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
artmentor = "artmentor.cli:main"

[tool.setuptools.packages.find]
include = ["artmentor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# RUF046 flags int() around values it believes are already ints. Ours wrap numpy
# scalars (np.intp, np.int64), where the cast is load-bearing: without it these
# leak into dataclasses and fail JSON serialization at the API boundary.
ignore = ["RUF046"]
