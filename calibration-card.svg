<text x="10.0" y="15.0" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#111111" text-anchor="start" font-weight="600">ArtMentorAI colour reference</text>
<text x="10.0" y="20.0" font-family="Helvetica, Arial, sans-serif" font-size="3.8" fill="#000000" text-anchor="start" font-weight="700">PRINT IN GREYSCALE / BLACK AND WHITE. Do not scale to fit.</text>
