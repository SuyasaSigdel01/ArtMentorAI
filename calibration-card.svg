<rect x="140.4" y="27.0" width="29.6" height="16.0" fill="#464646" stroke="#cccccc" stroke-width="0.2"/>
<text x="10.0" y="51.0" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#777777" text-anchor="start" font-weight="normal">If the two lightest squares look identical in your photo, it is overexposed — move to softer light.</text>
<rect x="10.0" y="57.0" width="34.0" height="34.0" fill="#ffffff" stroke="#333333" stroke-width="0.6" stroke-dasharray="1.5 1.5"/>
<text x="27.0" y="74.0" font-family="Helvetica, Arial, sans-serif" font-size="4.0" fill="#999999" text-anchor="middle" font-weight="600">PAINT</text>
<text x="52.0" y="62.0" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#444444" text-anchor="start" font-weight="normal">1. Print this card in greyscale on matte paper.</text>
<text x="52.0" y="67.2" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#444444" text-anchor="start" font-weight="normal">2. Fill the dashed square with your mixed paint.</text>
<text x="52.0" y="72.4" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#444444" text-anchor="start" font-weight="normal">3. Let it dry — wet paint is glossy and reads too light.</text>
<text x="52.0" y="77.6" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#444444" text-anchor="start" font-weight="normal">4. Photograph the whole card flat, in even light.</text>
<text x="52.0" y="82.8" font-family="Helvetica, Arial, sans-serif" font-size="3.5" fill="#444444" text-anchor="start" font-weight="normal">5. Avoid direct sun and your own shadow.</text>
